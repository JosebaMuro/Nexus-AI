name: stable-diffusion.cpp Android (CPU + GPU Adreno)

# Compila sd-cli/sd-server de stable-diffusion.cpp para Android ARM64 con el NDK (upstream no publica binarios para
# Android) y deja los libsd-*.so en la rama android-sd-libs, de donde los toma cpp-entrega.yml (--sd-libs).
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Rama, etiqueta o commit de leejet/stable-diffusion.cpp
        default: master
  push:
    paths:
      - nexus-office-cpp/packaging/android/build_sd.sh
      - .github/workflows/android-sd.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Dependencias
        run: sudo apt-get update -q && sudo apt-get install -y -q ninja-build cmake opencl-c-headers python3

      - name: Compilar con el NDK
        run: |
          export ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}
          echo "NDK $ANDROID_NDK_HOME"
          bash nexus-office-cpp/packaging/android/build_sd.sh /tmp/out/lib /tmp/w "${{ inputs.ref || 'master' }}"

      - name: Dejar las bibliotecas en la rama android-sd-libs
        run: |
          cd /tmp/out
          tar czf android-sd-libs.tar.gz lib && sha256sum android-sd-libs.tar.gz > SHA256SUMS.txt
          git init -q -b android-sd-libs && git add . \
            && git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "stable-diffusion.cpp Android ($GITHUB_SHA)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-sd-libs
