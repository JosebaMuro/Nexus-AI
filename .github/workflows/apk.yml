name: APK de Nexus-Office (sin la firma definitiva)

# Compila la app Android «VPN» y la «autonoma» con el SDK de Android del runner. El runtime ARM64 (Python, llama.cpp
# con CPU, GPU y NPU) se toma de la APK autonoma de la Release anterior (BASE). Se firman con una clave temporal: la
# firma definitiva se pone fuera de GitHub (la clave nunca entra en el repositorio). Las APK quedan, en trozos, en
# la rama «apk-sin-firmar» (se rehacen cuando cambia el codigo de la app).
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apk.yml

permissions:
  contents: write

env:
  BASE: v1.8.0
  GH_TOKEN: ${{ github.token }}

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # mismo numero magico de .pyc que el Python de la app
      - name: Runtime de Android de la APK anterior
        run: |
          set -e
          gh release download "$BASE" -R "$GITHUB_REPOSITORY" -p "Nexus-Office-${BASE#v}-android-autonomo.apk" -D old
          R=nexus-office/.cache/android-runtime
          mkdir -p x "$R/lib"
          (cd x && unzip -q ../old/*.apk "lib/arm64-v8a/*" assets/runtime.zip)
          cp x/lib/arm64-v8a/* "$R/lib/"
          (cd "$R" && unzip -q "$GITHUB_WORKSPACE/x/assets/runtime.zip" "py/*")
          chmod +x "$R/py/bin/python3.12"
          ls "$R/lib"; du -sh "$R/py"
          rm -rf x old
      - name: Compilar
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          JAR=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | grep -E 'android-3[4-9]$' | head -1)/android.jar
          echo "build-tools: $BT · android.jar: $JAR"
          export PATH="$BT:$PATH" NEXUS_ANDROID_JAR="$JAR"
          python -m pip install -q pillow
          cd nexus-office
          python packaging/build_apk.py
          python packaging/build_apk_autonomo.py
          ls -la dist
          "$BT/apksigner" verify --print-certs dist/*.apk | head -8
      - name: Dejar las APK en la rama apk-sin-firmar
        run: |
          set -e
          mkdir ../apk && cp nexus-office/dist/*.apk ../apk/
          cd ../apk && for f in *.apk; do split -b 90m -d -a 3 "$f" "$f."; rm "$f"; done
          sha256sum "$GITHUB_WORKSPACE"/nexus-office/dist/*.apk | sed "s#$GITHUB_WORKSPACE/nexus-office/dist/##" > SHA256SUMS.txt
          git init -q -b apk-sin-firmar && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "APK ${GITHUB_SHA::8} (firma temporal)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-sin-firmar
