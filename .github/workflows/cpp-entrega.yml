name: Nexus-Office C++ (instaladores y pruebas con modelo real)

# Entrega de la edicion C++ (nexus-office-cpp, 2.0 beta C):
#  1. cpp.yml compila y prueba nexus-office en cada sistema nativo (artefactos cpp-<plataforma>)
#  2. voz: whisper-cli (whisper.cpp) compilado en cada sistema y piper (rhasspy/piper) precompilado
#  3. paquetes: .exe (NSIS), .run, .deb, AppImage, Flatpak y macOS con packaging/build.py; llama-server y sd-cli salen
#     de los instaladores de la Release BASE de la edicion Python (los mismos motores, sin recompilarlos)
#  4. humo: cada instalador se instala en su sistema y se prueba con modelos reales (packaging/smoke_test.py)
#  5. android: nexus-office con el NDK, APK autonoma (firma temporal) y prueba en el emulador de Android
# Las APK quedan, en trozos, en la rama «apk-cpp-sin-firmar»; la firma definitiva se pone fuera de GitHub y
# cpp-publicar.yml publica la Release.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cpp-entrega.yml

permissions:
  contents: write
  actions: read

env:
  BASE: v2.0.0
  GH_TOKEN: ${{ github.token }}
  PIPER: "2023.11.14-2"
  WHISPER: v1.7.6

jobs:
  cpp:
    uses: ./.github/workflows/cpp.yml

  voz:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, os: ubuntu-22.04, piper: piper_linux_x86_64.tar.gz }
          - { target: linux-aarch64, os: ubuntu-22.04-arm, piper: piper_linux_aarch64.tar.gz }
          - { target: macos-arm64, os: macos-latest, piper: piper_macos_aarch64.tar.gz }
          - { target: macos-x86_64, os: macos-15-intel, piper: piper_macos_x64.tar.gz }
          - { target: windows-x64, os: windows-latest, piper: piper_windows_amd64.zip }
          - { target: windows-arm64, os: windows-11-arm, piper: piper_windows_amd64.zip }
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - name: whisper.cpp
        shell: bash
        run: |
          set -e
          git clone -q --depth 1 --branch "$WHISPER" https://github.com/ggml-org/whisper.cpp w
          X=""
          case "${{ matrix.target }}" in
            # x86_64: sin AVX2 ni FMA para que funcione tambien en procesadores antiguos
            *x86_64|windows-x64) X="-DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF -DGGML_BMI2=OFF -DGGML_AVX=ON" ;;
            # ggml no admite MSVC en ARM: Clang de Visual Studio (ClangCL)
            windows-arm64) X="-T ClangCL -A ARM64" ;;
          esac
          L=(); [ "$RUNNER_OS" = Linux ] && L=("-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc")
          cmake -S w -B wb -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP=OFF -DCMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded $X "${L[@]}"
          cmake --build wb --config Release --parallel 4 --target whisper-cli
          mkdir -p voz/whisper
          f=$(find wb -type f \( -name whisper-cli -o -name whisper-cli.exe \) | head -1)
          cp "$f" voz/whisper/
          cp w/LICENSE voz/whisper/LICENSE.txt
          ls -la voz/whisper
          voz/whisper/whisper-cli* --help 2>&1 | head -3
      - name: piper
        shell: bash
        run: |
          set -e
          curl -fsSL -o p.pkg "https://github.com/rhasspy/piper/releases/download/$PIPER/${{ matrix.piper }}"
          mkdir -p px
          case "${{ matrix.piper }}" in *.zip) unzip -q p.pkg -d px ;; *) tar -xzf p.pkg -C px ;; esac
          mv px/piper voz/piper
          ls voz/piper | head -30
          echo "hola" | voz/piper/piper* --help 2>&1 | head -3 || true
      - uses: actions/upload-artifact@v4
        with:
          name: voz-${{ matrix.target }}
          path: voz/
          retention-days: 7

  paquetes:
    needs: [cpp, voz]
    strategy:
      fail-fast: false
      matrix:
        target: [windows-x64, windows-arm64, linux-x86_64, linux-aarch64, macos-arm64, macos-x86_64]
    runs-on: ubuntu-24.04
    steps:
      - name: Liberar espacio
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nsis flatpak p7zip-full >/dev/null
          python -m pip install -q pillow
      - uses: actions/download-artifact@v4
        with:
          name: cpp-${{ matrix.target }}
          path: nexus-office-cpp/.cache/cpp/${{ matrix.target }}
      - uses: actions/download-artifact@v4
        with:
          name: voz-${{ matrix.target }}
          path: voz
      - name: Motores de IA del instalador de la edicion Python (BASE)
        run: |
          set -e
          T=${{ matrix.target }}; V=${BASE#v}
          case $T in
            windows-*) A=Nexus-Office-Setup-$V-$T.exe ;;
            linux-*) A=Nexus-Office-$V-$T.run ;;
            macos-*) A=Nexus-Office-$V-$T.tar.gz ;;
          esac
          gh release download "$BASE" -R "$GITHUB_REPOSITORY" -p "$A" -D old
          mkdir -p x
          case $A in
            *.exe) 7z x -y -ox "old/$A" >/dev/null ;;
            *.run) l=$(awk '/^__NEXUS_ARCHIVE__$/{print NR + 1; exit}' "old/$A"); tail -n +"$l" "old/$A" | tar -xz -C x --wildcards '*/bundled/runtimes/llama/*' '*/bundled/runtimes/sd/*' ;;
            *.tar.gz) tar -xzf "old/$A" -C x --wildcards '*/bundled/runtimes/llama/*' '*/bundled/runtimes/sd/*' ;;
          esac
          rm -rf old
          B=$(find x -type d -path '*bundled/runtimes' | head -1)
          RT=nexus-office-cpp/.cache/desktop-runtimes/$T
          mkdir -p "$RT"
          cp -r "$B/llama" "$B/sd" "$RT/"
          cp -r voz/piper voz/whisper "$RT/"
          rm -rf x voz
          find "$RT" -maxdepth 2 | head -40; du -sh "$RT"/*
      - name: Construir
        run: cd nexus-office-cpp && python packaging/build.py --targets ${{ matrix.target }}
      - name: Lista
        run: ls -la nexus-office-cpp/dist/*/ && df -h /
      - uses: actions/upload-artifact@v4
        with:
          name: instalador-cpp-${{ matrix.target }}
          path: |
            nexus-office-cpp/dist/windows/
            nexus-office-cpp/dist/linux/
            nexus-office-cpp/dist/macos/
          retention-days: 7
          compression-level: 0

  humo:
    needs: paquetes
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x86_64, os: ubuntu-24.04 }
          - { target: linux-aarch64, os: ubuntu-24.04-arm }
          - { target: macos-arm64, os: macos-latest }
          - { target: macos-x86_64, os: macos-15-intel }
          - { target: windows-x64, os: windows-latest }
          - { target: windows-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: nexus-office-cpp/packaging
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q websockets
      - uses: actions/download-artifact@v4
        with:
          name: instalador-cpp-${{ matrix.target }}
          path: inst
      - name: Instalar (.run)
        if: runner.os == 'Linux'
        run: |
          ls -laR inst
          sh inst/*/Nexus-Office-*-${{ matrix.target }}.run "$HOME/nxc" --modelos=no
          echo "NX=$HOME/nxc" >> "$GITHUB_ENV"
      - name: Instalar (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p "$HOME/nxa" && tar -xzf inst/*/Nexus-Office-*-${{ matrix.target }}.tar.gz -C "$HOME/nxa"
          cd "$HOME/nxa"/Nexus-Office && ./install.sh --modelos=no
          echo "NX=$HOME/nxa/Nexus-Office" >> "$GITHUB_ENV"
      - name: Instalar (Windows, instalador grafico en silencio)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem inst -Recurse -Filter "Nexus-Office-Setup-*.exe" | Select-Object -First 1
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '/S', '/MODELOS=no', '/D=C:\nxc' -Wait -PassThru
          "instalador: codigo $($p.ExitCode)"
          Get-ChildItem C:\nxc | Format-Table Name, Length
          if (!(Test-Path C:\nxc\nexus-office.exe) -or !(Test-Path C:\nxc\nexus-office-w.exe)) { throw "instalacion incompleta" }
          "NX=C:\nxc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Probar con modelos reales (chat, selector, voz, imagen y servicio)
        shell: bash
        run: python nexus-office-cpp/packaging/smoke_test.py "$NX"
      - name: Probar el .deb
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y -qq ./inst/*/nexus-office-c_*.deb >/dev/null
          nexus-office-c --version
          python nexus-office-cpp/packaging/smoke_test.py /opt/nexus-office-c --sin-imagen --sin-servicio
          sudo apt-get remove -y -qq nexus-office-c >/dev/null
      - name: Probar la AppImage
        if: runner.os == 'Linux'
        run: |
          cd "$RUNNER_TEMP" && chmod +x "$GITHUB_WORKSPACE"/inst/*/*.AppImage
          "$GITHUB_WORKSPACE"/inst/*/Nexus-Office-*-${{ matrix.target }}.AppImage --appimage-extract >/dev/null
          python "$GITHUB_WORKSPACE/nexus-office-cpp/packaging/smoke_test.py" "$RUNNER_TEMP/squashfs-root/nexus" --sin-imagen --sin-servicio
      - name: Probar el Flatpak
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get install -y -qq flatpak >/dev/null
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive inst/*/Nexus-Office-*-linux-x86_64.flatpak
          flatpak run ai.nexus.NexusOfficeCpp --version

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: nexus-office para Android (NDK, ARM64)
        run: |
          set -e
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"; echo "NDK: $NDK"
          cmake -S nexus-office-cpp -B abuild -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static -DNEXUS_BUILD_TESTS=OFF
          cmake --build abuild --parallel 4
          cmake --install abuild --prefix aout/Nexus-Office --strip
          file aout/Nexus-Office/nexus-office; ls -la aout/Nexus-Office
      - name: llama-server de la APK autonoma de la edicion Python (BASE)
        run: |
          set -e
          gh release download "$BASE" -R "$GITHUB_REPOSITORY" -p "Nexus-Office-${BASE#v}-android-autonomo.apk" -D old
          mkdir -p alibs && (cd alibs && unzip -q -j ../old/*.apk 'lib/arm64-v8a/libllama-server*.so')
          ls -la alibs; rm -rf old
      - name: APK autonoma (firma temporal)
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          JAR=$(ls -d "$ANDROID_HOME"/platforms/android-* | sort -V | grep -E 'android-3[4-9]$' | head -1)/android.jar
          export PATH="$BT:$PATH" NEXUS_ANDROID_JAR="$JAR"
          python -m pip install -q pillow
          python nexus-office-cpp/packaging/build_apk_autonomo.py --exe aout/Nexus-Office/nexus-office --libs alibs --recursos aout/Nexus-Office
          "$BT/apksigner" verify --print-certs nexus-office-cpp/dist-apk/*.apk | head -4
      - uses: actions/upload-artifact@v4
        with:
          name: apk-cpp
          path: nexus-office-cpp/dist-apk/
          retention-days: 7
      - name: Dejar la APK en la rama apk-cpp-sin-firmar
        run: |
          set -e
          mkdir ../apk && cp nexus-office-cpp/dist-apk/*.apk ../apk/
          cd ../apk && for f in *.apk; do split -b 90m -d -a 3 "$f" "$f."; rm "$f"; done
          (cd "$GITHUB_WORKSPACE/nexus-office-cpp/dist-apk" && sha256sum *.apk) > SHA256SUMS.txt
          echo "${{ github.run_id }}" > RUN.txt
          git init -q -b apk-cpp-sin-firmar && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "APK C++ ${GITHUB_SHA::8} (firma temporal)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-cpp-sin-firmar

  android-emulador:
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/download-artifact@v4
        with:
          name: apk-cpp
          path: apk
      - name: Arrancar la APK en Android 11 (x86_64 con traduccion de ARM64)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096
          script: |
            adb install -r apk/*.apk
            adb shell am start -n ai.nexus.office.cpp/ai.nexus.office.autonomo.MainActivity
            adb forward tcp:8775 tcp:8775
            ok=0; for i in $(seq 120); do if curl -sf http://127.0.0.1:8775/api/ping; then ok=1; break; fi; sleep 3; done; echo; adb shell run-as ai.nexus.office.cpp cat files/nexus.log | tail -40 || true; test $ok = 1
            curl -sf http://127.0.0.1:8775/api/status | head -c 600; echo
            curl -sf -X POST http://127.0.0.1:8775/api/accel/test -H 'Content-Type: application/json' -d '{}' | head -c 400; echo
