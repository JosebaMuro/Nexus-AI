name: Publicar la Release de Nexus-Office C++

# Se lanza al empujar la rama temporal «publicar-cpp-<version>» (no «entrega-*», que es la de la edicion Python): trae
# entrega/entrega.json ({"run": <id de la ejecucion de cpp-entrega.yml>, "tag": "v2.1.0-cpp", "target": <rama>}) y
# la APK autonoma ya firmada en trozos (entrega/apk/). Junta los instaladores de esa ejecucion, la APK VPN (la app
# cliente es la misma de la 2.0.0), los manuales en PDF, el codigo fuente limpio, LEEME y SHA256SUMS con
# nexus-construir (la herramienta C++ de esa misma ejecucion), publica la Release y borra la rama temporal.
on:
  push:
    branches:
      - "publicar-cpp-*"

permissions:
  contents: write
  actions: read

env:
  GH_TOKEN: ${{ github.token }}
  BASE: v2.0.0

jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - name: Liberar espacio
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - uses: actions/checkout@v4
      - name: Instaladores y nexus-construir de la ejecucion de cpp-entrega.yml
        run: |
          set -e
          RUN=$(jq -r .run entrega/entrega.json)
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -n construir-linux-x86_64 -D construir
          chmod +x construir/nexus-construir
          gh run download "$RUN" -R "$GITHUB_REPOSITORY" -p 'instalador-cpp-*' -D art
          mkdir -p nexus-office-cpp/dist
          for d in art/*/; do cp -r "$d"* nexus-office-cpp/dist/; done
          rm -rf art
          ls -laR nexus-office-cpp/dist
      - name: APK firmada y APK VPN
        run: |
          set -e
          mkdir -p apk
          for f in $(ls entrega/apk/*.apk.[0-9][0-9][0-9] | sed 's/\.[0-9][0-9][0-9]$//' | sort -u); do
            cat "$f".[0-9][0-9][0-9] > "apk/$(basename "$f")"
          done
          (cd apk && sha256sum -c ../entrega/apk/SHA256SUMS.txt)
          V=$(sed -n 's/^set(NEXUS_VERSION "\([^"]*\)").*/\1/p' nexus-office-cpp/CMakeLists.txt)
          gh release download "$BASE" -R "$GITHUB_REPOSITORY" -p "Nexus-Office-${BASE#v}-android-vpn.apk" -O "apk/Nexus-Office-$V-android-vpn.apk"
          ls -la apk
      - name: Manuales, codigo fuente, LEEME y sumas
        run: |
          set -e
          cd nexus-office-cpp
          NEXUS_CHROMIUM=$(command -v google-chrome || command -v chromium) ../construir/nexus-construir pdf ../manuales
          ../construir/nexus-construir paquetes --targets --keep --apk ../apk/*.apk --docs ../manuales/*.pdf
          mkdir -p ../release
          find dist -type f ! -name SHA256SUMS.txt -exec mv {} ../release/ \;
          cd ../release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt && du -sh .
      - name: Publicar
        run: |
          set -e
          TAG=$(jq -r .tag entrega/entrega.json)
          TARGET=$(jq -r '.target // "main"' entrega/entrega.json)
          V=${TAG#v}
          awk -v v="## Nexus-Office $V" '$0 ~ "^## " {p = (index($0, v) == 1)} p' nexus-office-cpp/CHANGELOG.md > notas.md
          # entrega por partes (p. ej. primero Windows x64 y Android): «nota» de entrega.json lo dice en las notas
          NOTA=$(jq -r '.nota // ""' entrega/entrega.json)
          if [ -n "$NOTA" ]; then printf '\n%s\n' "$NOTA" >> notas.md; else
            printf '\nEdición C++: se instala junto a la edición Python sin pisarla. Instaladores 100 %% offline para Windows (x64 y ARM64), Linux (x86_64 y ARM64: .run, .deb, AppImage y Flatpak), macOS (Apple Silicon e Intel) y Android (autónoma y VPN). Instrucciones en LEEME.txt; integridad en SHA256SUMS.txt.\n' >> notas.md
          fi
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$TAG" -R "$GITHUB_REPOSITORY" -F notas.md
          else
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$TARGET" --latest=false -t "Nexus-Office $V (edición C++)" -F notas.md
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber release/*
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[] | "\(.name) \(.size)"'
      - name: Borrar la rama temporal
        if: success()
        run: git push origin --delete "${GITHUB_REF_NAME}"
