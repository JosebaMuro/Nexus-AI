name: Nexus-Office C++ (compilar y probar)

# Edicion C++ de Nexus-Office (nexus-office-cpp/): compila y pasa las pruebas en cada sistema nativo y prueba la
# interfaz web en Chromium. Cada compilacion deja la carpeta instalada (ejecutable + nexus/) como artefacto
# «cpp-<plataforma>» y la herramienta de construccion como «construir-<plataforma>», que usa cpp-entrega.yml.
on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - nexus-office-cpp/**
      - .github/workflows/cpp.yml

permissions:
  contents: read

jobs:
  compilar:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux en 22.04 (glibc 2.35): funciona tambien en Debian 12 y Raspberry Pi OS de 64 bits
          - { target: linux-x86_64, os: ubuntu-22.04 }
          - { target: linux-aarch64, os: ubuntu-22.04-arm }
          - { target: macos-arm64, os: macos-latest }
          - { target: macos-x86_64, os: macos-15-intel }
          - { target: windows-x64, os: windows-latest }
          - { target: windows-arm64, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: Compilador (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq g++-12 >/dev/null
          echo "CC=gcc-12" >> "$GITHUB_ENV" && echo "CXX=g++-12" >> "$GITHUB_ENV"
      - name: Configurar
        shell: bash
        run: cmake -S nexus-office-cpp -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compilar
        shell: bash
        run: cmake --build build --config Release --parallel 4
      - name: Pruebas
        shell: bash
        env:
          NEXUS_ONLINE_TESTS: "1"   # cotizaciones reales de la bolsa con la pila TLS de cada sistema
        run: ctest --test-dir build -C Release --output-on-failure --timeout 900
      - name: Instalar en una carpeta
        shell: bash
        run: |
          cmake --install build --config Release --prefix out/Nexus-Office --strip
          ls -la out/Nexus-Office
          EXE=out/Nexus-Office/nexus-office; [ -f "$EXE.exe" ] && EXE="$EXE.exe"
          "$EXE" --version
          "$EXE" detect | head -40
      - name: Herramienta de construccion
        shell: bash
        run: |
          mkdir -p construir
          f=$(find build -type f \( -name nexus-construir -o -name nexus-construir.exe \) | head -1)
          cp "$f" construir/
          construir/nexus-construir* --version
      - name: Datos y manuales con nexus-construir
        if: matrix.target == 'linux-x86_64'
        run: |
          set -e
          C=$PWD/construir/nexus-construir
          # src/gen/data.cpp debe estar al dia con recursos/datos/*.json
          (cd nexus-office-cpp && "$C" datos) && git diff --exit-code nexus-office-cpp/src/gen/data.cpp
          NEXUS_CHROMIUM=$(command -v google-chrome || command -v chromium) "$C" pdf manuales
          ls -la manuales && test "$(head -c 5 manuales/Manual-de-usuario.pdf)" = "%PDF-"
      - uses: actions/upload-artifact@v4
        with:
          name: cpp-${{ matrix.target }}
          path: out/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: construir-${{ matrix.target }}
          path: construir/
          retention-days: 7

  interfaz:
    needs: compilar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cpp-linux-x86_64
          path: cpp
      - name: Arrancar Nexus-Office
        run: |
          chmod +x cpp/Nexus-Office/nexus-office
          NEXUS_DATA_DIR=$RUNNER_TEMP/cpp nohup cpp/Nexus-Office/nexus-office run --no-browser --port 8790 > cpp.log 2>&1 &
          for i in $(seq 60); do curl -sf localhost:8790/api/ping && break; sleep 2; done
      - name: Interfaz web en Chromium
        run: |
          npm i --no-save playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          mkdir -p capturas && node nexus-office-cpp/tests/ui_smoke.js http://127.0.0.1:8790 capturas
      - name: Registros
        if: always()
        run: tail -50 cpp.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-interfaz
          path: capturas/
          retention-days: 7
