name: Nexus-Office Python (pruebas)

# Edicion Python (nexus-office/): pruebas en Linux y Windows de 64 bits, mas las que necesitan internet
# (cotizaciones reales de la mesa de bolsa), que en las sesiones de desarrollo no se pueden ejecutar.
on:
  workflow_dispatch:
  push:
    paths:
      - nexus-office/**
      - .github/workflows/python.yml

permissions:
  contents: read

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: nexus-office
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dependencias
        run: python -m pip install -q -r requirements.txt
      - name: Cotizaciones reales (internet)
        env:
          NEXUS_ONLINE_TESTS: "1"
        run: python -m pytest -q -s tests/test_bolsa_online.py
      - name: Pruebas
        if: always()
        run: python -m pytest -q -p no:cacheprovider tests
