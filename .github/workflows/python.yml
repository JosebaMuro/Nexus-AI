name: Agente IA (Python) - pruebas

# Edicion Python (nexus-office/), la base desde la 4.0.0: pruebas en Linux y Windows de 64 bits en cada cambio. Las
# que necesitan internet (cotizaciones reales de la mesa de bolsa), que en las sesiones de desarrollo no se pueden
# ejecutar, solo al lanzarlo a mano para que una caida de la fuente no ponga en rojo un cambio.
on:
  workflow_dispatch:
  push:
    paths:
      - nexus-office/**
      - firmware/flash.py
      - firmware/nexuspico/nexuspico.py
      - .github/workflows/python.yml

# un empuje nuevo a la misma rama cancela las pruebas del anterior
concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      NEXUS_NO_KNOWLEDGE_PACKS: "1"
    defaults:
      run:
        working-directory: nexus-office
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: nexus-office/requirements.txt
      - name: Dependencias
        run: python -m pip install -q -r requirements.txt
      - name: Cotizaciones reales (internet)
        if: github.event_name == 'workflow_dispatch'
        env:
          NEXUS_ONLINE_TESTS: "1"
          PYTHONUTF8: "1"
        run: python -m pytest -q -s tests/test_bolsa_online.py tests/test_avatares.py::test_catalogos_reales
      - name: Pruebas
        if: always()
        run: python -m pytest -q -p no:cacheprovider tests
