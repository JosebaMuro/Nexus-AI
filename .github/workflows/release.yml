name: Publicar Release

# Une los trozos de la rama binarios-tmp, verifica SHA256SUMS.txt,
# publica la Release con los ficheros enteros y borra la rama temporal.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Etiqueta de la Release
        default: v1.6.0
      rama:
        description: Rama con los trozos
        default: binarios-tmp

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      RAMA: ${{ inputs.rama }}
    steps:
      - name: Liberar espacio
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rama }}
          fetch-depth: 1

      - name: Unir trozos y verificar
        run: |
          mkdir -p ../salida
          cd trozos
          for f in $(ls | sed 's/\.[0-9][0-9][0-9]$//' | sort -u); do
            cat "$f".[0-9][0-9][0-9] > "../../salida/$f"
            rm -f "$f".[0-9][0-9][0-9]
          done
          cd ../../salida
          cp "$GITHUB_WORKSPACE/SHA256SUMS.txt" .
          # SHA256SUMS.txt usa subcarpetas; aquí los ficheros están planos
          sed 's#  [a-z]*/#  #' SHA256SUMS.txt | sha256sum -c -
          ls -la

      - name: Publicar Release
        run: |
          cd ../salida
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target main \
              -t "NEXUS AI ${TAG#v}" \
              -n "Instaladores portables 100 % offline para Windows, Linux (x86_64 y ARM64), macOS y Android. Instrucciones en LEEME.txt; integridad en SHA256SUMS.txt."
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber ./*

      - name: Borrar rama temporal
        run: git push origin --delete "$RAMA"
