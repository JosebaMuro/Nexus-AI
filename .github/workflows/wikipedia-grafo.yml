name: Grafo multicapa de la Wikipedia en español

# Genera el grafo de ejemplo («nexus-construir grafo-wikipedia», nexus-office-cpp/tools/construir/grafo.cpp) con las
# API públicas de es.wikipedia.org y
# wikidata.org, que necesitan internet, y lo deja en la rama «datos-grafo-wikipedia» (y como artefacto) para que se
# incluya en la Release, en la web de descargas y en los paquetes como ejemplo para importar.
on:
  push:
    paths:
      - "nexus-office-cpp/tools/construir/grafo.cpp"
      - ".github/workflows/wikipedia-grafo.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wikipedia-grafo
  cancel-in-progress: true

jobs:
  grafo:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Compilar nexus-construir y nexus-office
        run: |
          cmake -S nexus-office-cpp -B build -DCMAKE_BUILD_TYPE=Release -DNEXUS_BUILD_TESTS=OFF -DNEXUS_LTO=OFF
          cmake --build build --parallel 4 --target nexus-construir nexus-office
      - name: Generar el grafo
        run: build/nexus-construir grafo-wikipedia --salida grafo-wikipedia-es --articulos 1500
      - name: Comprobar que se importa
        run: |
          set -e
          N=$(jq '.nodes | length' grafo-wikipedia-es/grafo.json); E=$(jq '.links | length' grafo-wikipedia-es/grafo.json)
          C=$(jq '[.nodes[].capa, .links[].capa] | unique | length' grafo-wikipedia-es/grafo.json)
          echo "$N nodos, $E relaciones, $C capas"
          test "$N" -gt 500 && test "$E" -gt 1000 && test "$C" = 4
          NEXUS_DATA_DIR=$RUNNER_TEMP/nx build/nexus-office grafo importar grafo-wikipedia-es/grafo.graphml --en general
      - uses: actions/upload-artifact@v4
        with:
          name: grafo-wikipedia-es
          path: grafo-wikipedia-es
      - name: Dejarlo en la rama datos-grafo-wikipedia
        run: |
          set -e
          cd grafo-wikipedia-es
          git init -q -b datos-grafo-wikipedia
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Grafo multicapa de la Wikipedia en español (${GITHUB_SHA::8})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" datos-grafo-wikipedia
