; NexusLED con PlatformIO: pio run -e esp32 -t upload   (o -e esp32s3 / -e esp32c3 / -e esp8266 / -e nodemcu)
; Necesita la plataforma pioarduino (nucleo Arduino-ESP32 3.x).
[platformio]
src_dir = nexusled

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1

; ESP8266 (ESP-01/01S de 1 MB; para NodeMCU o Wemos usa -e nodemcu)
[env:esp8266]
platform = espressif8266
board = esp01_1m
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.1m64.ld

[env:nodemcu]
platform = espressif8266
board = nodemcuv2
board_build.ldscript = eagle.flash.4m1m.ld
