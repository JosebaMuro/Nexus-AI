; NexusLED con PlatformIO: pio run -e esp32 -t upload   (o -e esp32s3 / -e esp32c3)
; Necesita la plataforma pioarduino (nucleo Arduino-ESP32 3.x).
[platformio]
src_dir = nexusled

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

[env:esp32]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1
