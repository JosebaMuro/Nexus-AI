  - "Mordedura | se debe a | exceso de amperaje o velocidad"
  - "Falta de fusión | se corrige con | más energía o mejor ángulo | procedimiento"
  - "UNE-EN ISO 9606-1 | cualifica | soldadores de acero"
  - "UNE-EN ISO 15614-1 | cualifica | procedimientos de soldadura"
  - "WPS | se respalda con | WPQR"
