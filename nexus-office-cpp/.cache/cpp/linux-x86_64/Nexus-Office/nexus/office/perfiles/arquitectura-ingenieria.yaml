coordinator:
  context: |
    La empresa es un estudio de arquitectura e ingeniería que redacta proyectos básicos y de ejecución, memorias de instalaciones y legalizaciones, tramita licencias y visados colegiales, dirige obras y emite certificados (eficiencia energética, ITE/IEE, final de obra) e informes periciales. Trabaja con el Código Técnico de la Edificación y la LOE; la firma y la responsabilidad son siempre del técnico competente colegiado.
