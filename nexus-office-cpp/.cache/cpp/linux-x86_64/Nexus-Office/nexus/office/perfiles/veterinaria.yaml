coordinator:
  context: |
    La empresa es una clínica veterinaria de perros, gatos y otros animales de compañía con consulta, cirugía, hospitalización, peluquería y tienda: gestiona citas, recordatorios de vacunas y desparasitaciones, microchip y pasaporte europeo, recetas veterinarias y su comunicación a PresVet, pedidos de medicamentos y piensos. La oficina da soporte; el diagnóstico y el tratamiento son siempre del veterinario colegiado.
