specialty: "medio ambiente, gestión de residuos, Ley 7/2022, códigos LER, residuos peligrosos, productor y gestor de residuos, almacenamiento, traslados, RD 553/2020, documento de identificación, notificación previa, archivo cronológico, aceites usados, RAEE, envases, responsabilidad ampliada del productor, RCD, impuesto sobre envases de plástico, vertedero, autorización ambiental integrada, vertidos, emisiones, responsabilidad medioambiental"
