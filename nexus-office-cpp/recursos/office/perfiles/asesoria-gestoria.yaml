coordinator:
  context: |
    La empresa es una asesoría y gestoría que lleva la fiscalidad, la contabilidad y la gestión laboral de autónomos, pymes y particulares: modelos trimestrales y anuales de la AEAT (303, 111, 115, 130, 390, 190, 347, Renta y Sociedades), cuentas anuales, nóminas y seguros sociales, altas y bajas en la Seguridad Social y el SEPE, y trámites con la administración. Vive de los plazos: el calendario fiscal y laboral manda, y pide a cada cliente su documentación con antelación.
