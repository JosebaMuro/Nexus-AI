coordinator:
  context: |
    La empresa es una autoescuela autorizada por la DGT que prepara permisos AM, A1, A2, B y profesionales: matricula alumnos, imparte el teórico y las clases prácticas con vehículos de doble mando, organiza las presentaciones a examen en la Jefatura Provincial de Tráfico, lleva el seguimiento de cada alumno y cobra por paquetes de prácticas.
