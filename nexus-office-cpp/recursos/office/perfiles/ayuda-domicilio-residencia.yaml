coordinator:
  context: |
    La empresa presta servicio de ayuda a domicilio y gestiona una residencia y centro de día para personas mayores y dependientes, con plazas privadas y concertadas o con prestación vinculada de la Ley de dependencia: elabora planes de atención individualizados, organiza rutas y turnos de auxiliares y gerocultores, lleva registros asistenciales y protocolos (caídas, úlceras, sujeciones) y se coordina con familias y servicios sociales. Lo clínico corresponde a enfermería y medicina.
