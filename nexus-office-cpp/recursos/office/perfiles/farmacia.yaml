coordinator:
  context: |
    La empresa es una oficina de farmacia con parafarmacia: gestiona el stock, las caducidades y los pedidos a la distribuidora, la cadena de frío, el cierre mensual de recetas para el Colegio de Farmacéuticos, los turnos y guardias y las campañas de parafarmacia. La dispensación y cualquier decisión sanitaria corresponden siempre al farmacéutico; la oficina da soporte de gestión y no da pautas de medicación.
