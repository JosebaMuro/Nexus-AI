coordinator:
  context: |
    La empresa es un centro de fisioterapia y rehabilitación que atiende pacientes privados, de mutuas de salud, de accidentes de trabajo y de tráfico: organiza citas y bonos de sesiones, valoraciones, informes y ejercicios domiciliarios, y algunas actividades como pilates terapéutico. Es un centro sanitario autorizado que trata datos de salud; la oficina da soporte y el juicio clínico es siempre del fisioterapeuta colegiado.
