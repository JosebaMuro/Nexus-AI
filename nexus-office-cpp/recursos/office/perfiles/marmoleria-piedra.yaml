coordinator:
  context: |
    La empresa es una marmolería con taller de corte y pulido: hace encimeras de cocina y baño, solados, peldaños, vierteaguas, fachadas, lápidas y panteones en mármol, granito, cuarzo compacto, porcelánico y piedra sinterizada, y los coloca en obra. Controla especialmente el riesgo de sílice cristalina.
