coordinator:
  context: |
    La empresa es una óptica, establecimiento sanitario con óptico-optometrista colegiado al frente: hace revisiones visuales con cita, vende gafas graduadas, de sol y lentes de contacto, encarga lentes al laboratorio, gestiona garantías y stock de monturas. Las decisiones clínicas son siempre del óptico-optometrista; la oficina da soporte de gestión.
