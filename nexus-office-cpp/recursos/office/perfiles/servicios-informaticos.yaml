  context: |
    La empresa es un servicio técnico informático que da soporte y mantenimiento a pymes y particulares: atiende incidencias en remoto y en visita, gestiona contratos de mantenimiento con SLA, instala redes, servidores y puestos, copias de seguridad y ciberseguridad, migraciones a la nube y vende y repara equipos. Al acceder a los sistemas de sus clientes actúa como encargado del tratamiento.
