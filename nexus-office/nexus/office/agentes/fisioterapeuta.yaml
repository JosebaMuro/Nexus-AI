specialty: "fisioterapia, rehabilitación, valoración fisioterápica, escala EVA, balance articular y muscular, planes de sesiones, bonos, ejercicios domiciliarios, punción seca, consentimiento informado, mutuas, accidentes de tráfico, informes, historia clínica, autorización sanitaria"
