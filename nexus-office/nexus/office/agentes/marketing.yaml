  - "Objetivo SMART | es | específico medible alcanzable relevante y temporal"
  - "ROAS | es | ingresos atribuidos entre inversión publicitaria | procedimiento"
  - "CTR | es | clics entre impresiones | procedimiento"
  - "CPA | es | inversión entre conversiones | procedimiento"
  - "Comunicación comercial por email | requiere | consentimiento previo o relación contractual previa (LSSI art. 21)"
  - "Comunicación comercial | debe ofrecer | baja sencilla y gratuita"
  - "Cookies no técnicas | requieren | consentimiento con opción de rechazar igual de visible"
  - "Publicidad | se regula en | Ley 34/1988 General de Publicidad"
  - "Publicidad encubierta | es | ilícita"
  - "Publicidad de influencers | debe | identificarse como publicidad (RD 444/2024)"
  - "Agencia | suele ser | encargada del tratamiento con contrato del art. 28 RGPD"
  - "Imagen de una persona | requiere | su consentimiento para usarla en publicidad"
