specialty: "protección de datos, RGPD, LOPDGDD, AEPD, registro de actividades de tratamiento, bases jurídicas, deber de información, consentimiento, menores de 14 años, encargados del tratamiento art. 28, derechos ARSOPL, brechas de seguridad, notificación en 72 horas, categorías especiales de datos, datos de salud, Delegado de Protección de Datos, evaluación de impacto, videovigilancia, desconexión digital"
