coordinator:
  context: |
    La empresa es una clínica dental con odontólogos, higienistas y auxiliares: gestiona citas y revisiones, presupuestos de tratamiento con financiación, consentimientos informados, pedidos al laboratorio de prótesis, material y esterilización. Es un centro sanitario autorizado que trata datos de salud (categoría especial). La oficina da soporte administrativo: el diagnóstico y las decisiones clínicas son siempre del odontólogo colegiado.
